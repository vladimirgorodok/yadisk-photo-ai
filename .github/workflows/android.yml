name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # На ubuntu-latest Android SDK предустановлен ($ANDROID_HOME), лицензии приняты.
      - name: Install Android platform
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" || \
              echo "::warning::platforms;android-36 не установился — Gradle доустановит сам"
          else
            echo "::warning::sdkmanager не найден — полагаемся на автодогрузку Gradle"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Build web app for Android
        run: npm run build:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare named APKs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-out/yadisk-photo-ai-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "apk-out/yadisk-photo-ai-${VERSION}-release.apk"
          ls -lh apk-out

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: yadisk-photo-ai-debug-apk
          path: apk-out/*-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: yadisk-photo-ai-release-apk
          path: apk-out/*-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          generate_release_notes: true
